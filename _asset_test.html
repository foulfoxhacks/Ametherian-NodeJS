<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand asset test</title>
<style>
  body{margin:0;background:#fff;color:#120e1c;font:16px system-ui}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}
  .panel{border:1px solid #ddd;border-radius:16px;padding:24px;display:grid;place-items:center;min-height:420px}
  .dark{background:#120e1c;border-color:#2a2238}
  img{max-width:320px;max-height:380px}
  .mark{max-height:220px}
  p{text-align:center;font:12px monospace;margin:8px 0 0}
</style>
</head>
<body>
<div class="row">
  <div class="panel"><div><img class="mark" src="assets/ametherian-mark.svg" alt=""><p>mark svg (purple)</p></div></div>
  <div class="panel dark"><div><img class="mark" src="assets/ametherian-mark-white.svg" alt=""><p style="color:#fff">mark svg (white)</p></div></div>
  <div class="panel"><div><img src="assets/ametherian-lockup-black.svg" alt=""><p>lockup svg (black)</p></div></div>
  <div class="panel dark"><div><img src="assets/ametherian-lockup-white.svg" alt=""><p style="color:#fff">lockup svg (white)</p></div></div>
  <div class="panel"><div><img src="assets/ametherian-lockup-purple.png" alt=""><p>lockup png (purple)</p></div></div>
  <div class="panel dark"><div><img src="assets/nodejs-hex.svg" alt="Node.js" style="max-height:220px"><p style="color:#fff">official nodejs hex svg</p></div></div>
</div>
</body>
</html>
