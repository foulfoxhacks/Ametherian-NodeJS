name: Check Ametherian site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python scripts/build_site.py
      - run: python scripts/build_text_pages.py
      - run: python scripts/check-site.py
      - name: Collect generated site changes
        if: always()
        run: |
          { git diff --name-only --diff-filter=ACMRTUXB -z; git ls-files --others --exclude-standard -z; } | sort -zu > /tmp/site-generated-files
          if [ -s /tmp/site-generated-files ]; then
            tar --null -T /tmp/site-generated-files -czf /tmp/site-generated-diff.tar.gz
          else
            tar -czf /tmp/site-generated-diff.tar.gz --files-from /dev/null
          fi
      - name: Upload generated site diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-build-diff-${{ github.run_id }}
          path: /tmp/site-generated-diff.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Committed site matches a fresh build
        run: |
          # The site is generated from packages/, CHANGELOG.md and i18n/. If anything
          # changed without rebuilding (and translating), the published site would be stale.
          if ! git diff --quiet; then
            echo "::error::The committed site is out of date. Run: python scripts/build_site.py && python scripts/build_text_pages.py, translate any new segments (python scripts/i18n_extract.py), and commit the result."
            git status --short | head -50
            git diff --stat | tail -5
            exit 1
          fi
