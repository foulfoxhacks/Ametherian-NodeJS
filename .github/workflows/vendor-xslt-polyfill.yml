name: Vendor pinned XSLT polyfill
on:
  workflow_dispatch:
  push:
    branches:
      - fix/bundled-xslt-sitemap
    paths:
      - ".github/workflows/vendor-xslt-polyfill.yml"
      - "scripts/sitegen/common.py"
      - "scripts/build_site.py"
      - "scripts/check-site.py"
      - "sitemap.xsl"
      - "sitemap.xml"
      - "sitemap/index.html"
      - "assets/sitemap.js"
      - "assets/sitemap.css"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bundled-xslt-sitemap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the pinned upstream package
        run: |
          npm pack xslt-polyfill@1.0.37
          mkdir -p assets/vendor
          tar -xzf xslt-polyfill-1.0.37.tgz
          cp package/xslt-polyfill.min.js assets/vendor/xslt-polyfill.min.js
          cp package/LICENSE assets/vendor/LICENSE-xslt-polyfill.txt
          rm -rf package xslt-polyfill-1.0.37.tgz
          cat > assets/vendor/README.md <<'EOF'
          # Vendored XSLT polyfill

          - Package: xslt-polyfill
          - Version: 1.0.37 (pinned)
          - Upstream: https://github.com/mfreed7/xslt_polyfill
          - npm: https://www.npmjs.com/package/xslt-polyfill
          - License: BSD-3-Clause; see LICENSE-xslt-polyfill.txt

          This browser-side compatibility engine is bundled locally for the Ametherian sitemap viewer.
          Review upstream release notes and security advisories before updating the pinned version.
          EOF
      - name: Regenerate committed site output
        run: python scripts/build_site.py
      - name: Commit vendored runtime and generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned XSLT compatibility runtime"
            git push origin HEAD:fix/bundled-xslt-sitemap
          fi
